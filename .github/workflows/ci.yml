name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-pty es un módulo nativo; su electron-rebuild (postinstall) puede
      # fallar en CI sin toolchain nativo, pero está protegido con `|| echo`
      # y ni el lint, ni los tests, ni el build lo necesitan compilado.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `format:check` no se corre en CI todavía: el repo aún no fue formateado
      # con Prettier de una. Cuando se haga ese commit one-shot, sumar acá.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
